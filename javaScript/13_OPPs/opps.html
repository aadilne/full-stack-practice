<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Opps concept</title>
    <link rel="stylesheet" href="opps.css">
</head>
<body>

    <div id="objCard" class="obj-box">

        <h1 id="objTitle">Student Profile</h1>

        <p id="objName"></p>
        <p id="objAge"></p>
        <p id="objCity"></p>

        <button id="objBtn">Show Student</button>
    </div>

    <!-- 2 Object Creation -->
     <div id="createBox" class="create-card">

        <h1>Object Creation Techniques</h1>

        <button id="createBtn">
            Show Objects
        </button>

        <p id="createOutput"></p>

    </div>
<!-- 3. constructor function -->
    <div id="constructorCard">
        <h1>Student Information</h1>

        <div class="constructor-box">
            <p id="constructorOne"></p>
            <p id="constructorTwo"></p>
            <p id="constructorThree"></p>
        </div>
    </div>

    <!-- 4.this keyword  -->
      <div id="thisDemoPanel">

        <h1>`this` Keyword Demo</h1>

        <div class="this-info-box">

            <p id="thisObjectOutput"></p>

            <p id="thisConstructorOutput"></p>

            <p id="thisCallOutput"></p>

            <p id="thisApplyOutput"></p>

            <p id="thisBindOutput"></p>

        </div>

        <button id="thisEventButton"> Click Me </button>

        <p id="thisEventOutput"></p>

    </div>


    <!-- 5 — PROTOTYPE -->
     <main id="prototypeDemoArea">

        <h1>Prototype Demo</h1>

        <div class="prototype-info-card">

            <p id="prototypeOwnText"></p>

            <p id="prototypeMethodText"></p>

            <p id="prototypeChainText"></p>

            <p id="prototypeOwnCheck"></p>

            <p id="prototypeCreateText"></p>

        </div>

    </main>
    

    <!-- Phase 6 class -->
     <main id="classDemoPanel">

        <h1>JavaScript Classes</h1>

        <div class="class-result-card">

            <p id="classStudentResult"></p>

            <p id="classProductResult"></p>

            <p id="classExpressionResult"></p>

            <p id="classAnonymousResult"></p>

            <p id="classNamedResult"></p>

        </div>

    </main>

    <!-- Phase 7 - Class Methods -->
    <div id="methodLab7">

        <h1>Phase 7 - Class Methods</h1>

        <div class="method-card7">
            <h2>Class Method Examples</h2>

            <p id="instanceOutput7"></p>
            <p id="constructorOutput7"></p>
            <p id="staticOutput7"></p>
            <p id="fieldOutput7"></p>
            <p id="privateOutput7"></p>
            <p id="initOutput7"></p>
        </div>

    </div>

    
 <!-- PHASE 8 - ENCAPSULATION -->
    <!-- Main Phase 8 container -->
    <div id="encapsulationZone8">

        <h1>Phase 8 - Encapsulation</h1>

        <div class="encapsulation-card8">

            <h2>Encapsulation Demo</h2>

            <!-- Public property result -->
            <p id="publicPropertyResult8"></p>

            <!-- Private property result -->
            <p id="privatePropertyResult8"></p>

            <!-- Getter result -->
            <p id="getterResult8"></p>

            <!-- Setter validation result -->
            <p id="setterValidationResult8"></p>

            <!-- Read-only result -->
            <p id="readonlyResult8"></p>

            <!-- Closure result -->
            <p id="closureResult8"></p>

            <!-- Class encapsulation result -->
            <p id="classEncapsulationResult8"></p>

        </div>

    </div>


    <script src="opps.js"></script>
</body>
</html>
