<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error handling</title>
    <link rel="stylesheet" href="ErrorHandling.css">
</head>
<body>


     <!-- Phase 2 - Try Catch -->

    <div class="eh-p2-wrapper">

        <h2 id="ehP2Heading">JavaScript Error Handling</h2>

        <button id="ehP2BasicBtn">Basic Try Catch</button>
        <button id="ehP2DetailsBtn">Error Details</button>
        <button id="ehP2MultiBtn">Multiple Statements</button>
        <button id="ehP2NestedBtn">Nested Try Catch</button>
        <button id="ehP2SafeBtn">Safe Code</button>

        <p id="ehP2Result"></p>


        
        <!-- Phase 3 - Finally -->

    <div class="eh-p3-container">

        <h2 id="ehP3Heading">JavaScript Finally Practice</h2>

        <button id="ehP3ErrorBtn"> Error + Finally </button>

        <button id="ehP3SuccessBtn"> Success + Finally </button>

        <button id="ehP3ReturnBtn"> Return + Finally </button>

        <button id="ehP3CleanupBtn"> Cleanup Example </button>

        <p id="ehP3Result"></p>

    </div>

    <!-- Phase 4 - Throw new error -->

    <div class="eh-p4-container">

        <h2 id="ehP4Heading"> JavaScript Throw Practice </h2>

        <button id="ehP4ErrorBtn"> Throw Error </button>

        <button id="ehP4StringBtn"> Throw String </button>

        <button id="ehP4NumberBtn"> Throw Number </button>

        <button id="ehP4ObjectBtn"> Throw Object </button>

        <button id="ehP4ValidationBtn"> Check Age </button>

        <p id="ehP4Result"></p>

    </div>

    <!-- Phase 5 — Built-in Error Types -->
     <div class="eh-p5-container">

        <h2 id="ehP5Heading">JavaScript Built-in Errors </h2>

        <button id="ehP5ErrorBtn"> Error </button>

        <button id="ehP5TypeBtn"> TypeError </button>

        <button id="ehP5ReferenceBtn"> ReferenceError </button>

        <button id="ehP5RangeBtn"> RangeError </button>

        <button id="ehP5UriBtn"> URIError </button>

        <button id="ehP5AggregateBtn"> AggregateError </button>

        <button id="ehP5CheckBtn"> Check instanceof </button>

        <p id="ehP5Result"></p>
    </div>


<!-- PHASE 8 - PROMISE ERROR HANDLING -->
     <div class="eh-p8-container">

        <h1 id="ehP8Heading"> Promise Error Handling </h1>

        <button id="ehP8RejectBtn"> Promise Rejection </button>

        <button id="ehP8CatchBtn"> Then Catch </button>

        <button id="ehP8FinallyBtn"> Finally </button>

        <button id="ehP8ThrowBtn"> Throw in Then </button>

        <button id="ehP8PropagationBtn"> Error Propagation </button>

        <button id="ehP8MultipleCatchBtn"> Multiple Catch </button>

        <button id="ehP8AllBtn">Promise.all </button>

        <button id="ehP8AllSettledBtn"> Promise.allSettled </button>

        <button id="ehP8RaceBtn"> Promise.race </button>

        <button id="ehP8AnyBtn"> Promise.any </button>

        <button id="ehP8AggregateBtn"> AggregateError </button>

        <p id="ehP8Result">Result will appear here.</p>

    </div>

    <script src="ErrorHandling.js"></script>
</body>
</html>
