<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local storage and session storage</title>

    <link rel="stylesheet" href="local_and_session.css">

</head>
<body>
    <h1>Local Storage and Session Storage</h1>
    
    <div class="storage-panel">
        <h2>Local Storage Practice</h2>

        <input
            type="text"
            id="phaseTwoNameInput"
            placeholder="Enter your name"
        >

        <button id="phaseTwoSaveBtn">Save </button>

        <button id="phaseTwoReadBtn">Read</button>

        <button id="phaseTwoDeleteBtn">Delete</button>

        <button id="phaseTwoClearBtn">Clear All </button>

        <p id="phaseTwoResultText"></p>
    </div>

<!-- session storage -->

     <div class="session-box">

        <h2>Session Storage</h2>

        <input
            type="text"
            id="sessionStudentInput"
            placeholder="Enter your name"
        >

        <br><br>

        <button id="sessionSaveBtn">Save</button>

        <button id="sessionReadBtn">Read</button>

        <button id="sessionDeleteBtn">Delete</button>

        <button id="sessionClearBtn">Clear All</button>

        <p id="sessionOutputText"></p>

    </div>

    <!-- String, Number & Boolean Data -->
     


    <script src="local_and_session.js"></script>
</body>
</html>
