<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local storage and session storage</title>

    <link rel="stylesheet" href="local_and_session.css">

</head>
<body>
    <h1>Local Storage and Session Storage</h1>
    
    <div class="storage-panel">
        <h2>Local Storage Practice</h2>

        <input
            type="text"
            id="phaseTwoNameInput"
            placeholder="Enter your name"
        >

        <button id="phaseTwoSaveBtn">Save </button>

        <button id="phaseTwoReadBtn">Read</button>

        <button id="phaseTwoDeleteBtn">Delete</button>

        <button id="phaseTwoClearBtn">Clear All </button>

        <p id="phaseTwoResultText"></p>
    </div>

<!-- session storage -->

     <div class="session-box">

        <h2>Session Storage</h2>

        <input
            type="text"
            id="sessionStudentInput"
            placeholder="Enter your name"
        >

        <br><br>

        <button id="sessionSaveBtn">Save</button>

        <button id="sessionReadBtn">Read</button>

        <button id="sessionDeleteBtn">Delete</button>

        <button id="sessionClearBtn">Clear All</button>

        <p id="sessionOutputText"></p>

    </div>

    <!-- String, Number & Boolean Data -->
      <div class="type-storage-box">

        <h2>Storage Data Types</h2>

        <button id="typeSaveBtn">Save Data</button>

        <button id="typeReadBtn">Read Data</button>

        <p id="typeOutputText"></p>

    </div>
     
    <!-- object and array and JSON.stringify() and JSON.parse() -->
     <div class="phase-five-storage-panel">

        <h2>Objects & Arrays - Local Storage</h2>

        <button id="phaseFiveSaveObjectBtn"> Save Object </button>

        <button id="phaseFiveReadObjectBtn"> Read Object </button>

        <button id="phaseFiveUpdateObjectBtn"> Update Object </button>

        <button id="phaseFiveSaveArrayBtn"> Save Array </button>

        <button id="phaseFiveReadArrayBtn"> Read Array </button>

        <button id="phaseFiveUpdateArrayBtn"> Update Array </button>

        <button id="phaseFiveDeleteDataBtn"> Delete Data</button>

        <p id="phaseFiveOutputText"></p>

    </div>


    <script src="local_and_session.js"></script>
</body>
</html>
