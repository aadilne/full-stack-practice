<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> color switcher </title>
    <link rel="stylesheet" href="color_changer.css">
</head>
<body>

<div class="container">
<h1 class="headin">color switcher</h1>
<div class="inputContainer">
    <button class="btnRandom">Random color</button>
    <input type="text" id="inputText" placeholder="Enter a color or hex (e.g. with of #ffffff)">
    <button class="btnAplly">Apply color </button>
    
</div>
<p class="currentColor">Current color <span class="currentColorValue">green</span></p>
</div>

<script src="color_changer.js"></script>
</body>
</html>
