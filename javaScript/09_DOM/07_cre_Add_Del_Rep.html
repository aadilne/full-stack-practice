<!DOCTYPE html>
<html>
<head>
    <title>DOM Creating, Adding, Delete & Replace</title>
    <link rel="stylesheet" href="07_cre_Add_Del_Rep.css">
</head>

<body>

    <!-- Existing container -->
    <div id="container">
        <h2>Existing Container</h2>
    </div>

    <!-- List for dynamic list practice -->
    <ul id="list"></ul>

    <!-- Box for move practice -->
    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>

    <!-- Element for remove practice -->
    <p id="removeText">Remove Me</p>

    <!-- Parent and child for removeChild practice -->
    <div id="parent">
        <p id="child">Child Element</p>
    </div>

    <!-- Element for replace practice -->
    <p id="oldElement">Old Element</p>

    <!-- Element for replaceChild practice -->
    <div id="replaceParent">
        <p id="oldChild">Old Child</p>
    </div>


    <script src="07_cre_Add_Del_Rep.js"></script>

</body>
</html>
