<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Events Practice</title>
    <link rel="stylesheet" href="09_Mouse_And_Keyboard_Event.css">
</head>
<body>

    <div class="container">

        <h1>JavaScript Events</h1>

        <!-- Mouse event box -->
        <div id="mouseBox">
            Move, Click, Double Click, Press Mouse Here
        </div>

        <!-- Result area -->
        <p id="mouseResult">Mouse event result will appear here...</p>

        <!-- Keyboard input -->
        <input
            type="text"
            id="keyInput"
            placeholder="Type something here..."
        >

        <p id="keyResult">Keyboard event result will appear here...</p>

        <!-- Button for add/remove event listener -->
        <button id="addBtn">Add Click Event</button>
        <button id="removeBtn">Remove Click Event</button>

        <p id="buttonResult">Button result...</p>

    </div>

    <script src="09_Mouse_And_Keyboard_Event.js"></script>
</body>
</html>
