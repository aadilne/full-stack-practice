<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Reading Elements</title>
</head>

<body>

    <!-- 27. innerHTML -->
    <div id="box">
        <h1>Hello Aadil</h1>
        <p>I am learning JavaScript DOM</p>
    </div>


    <!-- 28. innerText / 29. textContent -->
    <div id="textBox">
        <p>Visible Text</p>
        <p style="display: none;">Hidden Text</p>
    </div>


    <!-- 32. value -->
    <input  id="username"  type="text"  value="Aadil" >


    <!-- 33. id / 34. className -->
    <div id="student" class="box container">
        Student Box
    </div>


    <!-- 35. tagName / 36. nodeName / 37. nodeType -->
    <h2 id="heading">JavaScript DOM</h2>


    <script src="03_Read_DOM_Element.js"></script>

</body>
