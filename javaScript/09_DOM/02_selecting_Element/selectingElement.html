

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Selecting Elements</title>
</head>

<body>

    
         <!-- 1. getElementById() -->

    <h1 id="mainHeading">Hello Aadil</h1>


    
         <!-- 2. getElementsByClassName() -->


    <p class="text">Paragraph 1</p>
    <p class="text">Paragraph 2</p>
    <p class="text">Paragraph 3</p>


    
    <!-- 3. getElementsByTagName() -->
    <p>Tag Paragraph 1</p>
    <p>Tag Paragraph 2</p>



    <!-- 4. getElementsByName() -->
         

    <input type="text" name="username" value="Aadil">

    <input type="text" name="username" value="Rahul">


    <!-- 5 & 6. querySelector() / querySelectorAll() -->

    <h2 id="subHeading">JavaScript DOM</h2>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>


         <!-- 7. Attribute Selector
         [type="text"] -->

    <input type="text" placeholder="Enter Name">

    <input type="email" placeholder="Enter Email">


         <!-- 22. Multiple Selectors -->

    <p class="special">Special Paragraph</p>

    <p class="normal">Normal Paragraph</p>



    <script src="selectingElement.js"></script>

</body>
</html>
