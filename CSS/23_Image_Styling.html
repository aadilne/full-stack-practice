<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and styleing</title>
    <link rel="stylesheet" href="23_Image_Styling.css">
</head>
<body>


    <main class="imPhaseWrap">
        <h1 class="imPhaseTitle">CSS Image Styling</h1>
        <p class="imPhaseInfo">Hover over the images to see the effects.</p>

        <div class="imGrid">

            <section class="imCard">
                <h3>1. Object Fit</h3>
                <img class="imFit" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>2. Object Position</h3>
                <img class="imPosition" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>3. Aspect Ratio</h3>
                <img class="imRatio" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>4. Image Rendering</h3>
                <img class="imRendering" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>5. Border Radius</h3>
                <img class="imRadius" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>6. Opacity</h3>
                <img class="imOpacity" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>7. Image Filter</h3>
                <img class="imFilter" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>8. Hover Effect</h3>
                <img class="imHover" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

            <section class="imCard">
                <h3>9. Image Overlay</h3>
                <div class="imOverlayWrap">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
                    <div class="imOverlay">
                        <span>Modern Home</span>
                    </div>
                </div>
            </section>

            <section class="imCard">
                <h3>10. Responsive Image</h3>
                <img class="imResponsive" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600" alt="Modern house">
            </section>

        </div>
    </main>

</body>
</html>
