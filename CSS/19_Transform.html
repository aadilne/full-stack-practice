<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform </title>
    <link rel="stylesheet" href="19_Transform.css">
</head>
<body>
    <h1>Transform</h1>

    <main class="trPhaseWrap">
        <h1 class="trPhaseTitle">CSS Transform</h1>

        <div class="trGrid">

            <section class="trCard">
                <h3>1. translate()</h3>
                <div class="trBox trTranslate">Move</div>
            </section>

            <section class="trCard">
                <h3>2. translateX()</h3>
                <div class="trBox trTranslateX">Move X</div>
            </section>

            <section class="trCard">
                <h3>3. translateY()</h3>
                <div class="trBox trTranslateY">Move Y</div>
            </section>

            <section class="trCard">
                <h3>4. scale()</h3>
                <div class="trBox trScale">Scale</div>
            </section>

            <section class="trCard">
                <h3>5. rotate()</h3>
                <div class="trBox trRotate">Rotate</div>
            </section>

            <section class="trCard">
                <h3>6. skew()</h3>
                <div class="trBox trSkew">Skew</div>
            </section>

            <section class="trCard">
                <h3>7. transform-origin</h3>
                <div class="trBox trOrigin">Origin</div>
            </section>

            <section class="trCard">
                <h3>8. matrix()</h3>
                <div class="trBox trMatrix">Matrix</div>
            </section>

        </div>
    </main>
    
</body>
</html>
