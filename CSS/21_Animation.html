<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <link rel="stylesheet" href="21_Animation.css">
</head>
<body>
    
    <main class="anPhaseWrap">
        <h1 class="anPhaseTitle">CSS Animation</h1>
        <p class="anPhaseInfo">Watch each box animate.</p>

        <div class="anGrid">

            <section class="anCard">
                <h3>1. Keyframes</h3>
                <div class="anTrack"><div class="anBox anKey">Move</div></div>
            </section>

            <section class="anCard">
                <h3>2. Animation Name</h3>
                <div class="anTrack"><div class="anBox anName">Name</div></div>
            </section>

            <section class="anCard">
                <h3>3. Duration</h3>
                <div class="anTrack"><div class="anBox anDuration">2 sec</div></div>
            </section>

            <section class="anCard">
                <h3>4. Timing Function</h3>
                <div class="anTrack"><div class="anBox anTiming">Speed</div></div>
            </section>

            <section class="anCard">
                <h3>5. Delay</h3>
                <div class="anTrack"><div class="anBox anDelay">Wait</div></div>
            </section>

            <section class="anCard">
                <h3>6. Iteration Count</h3>
                <div class="anTrack"><div class="anBox anCount">3 times</div></div>
            </section>

            <section class="anCard">
                <h3>7. Direction</h3>
                <div class="anTrack"><div class="anBox anDirection">Reverse</div></div>
            </section>

            <section class="anCard">
                <h3>8. Fill Mode</h3>
                <div class="anTrack"><div class="anBox anFill">Stay</div></div>
            </section>

            <section class="anCard">
                <h3>9. Play State</h3>
                <div class="anTrack"><div class="anBox anPlay">Hover me</div></div>
            </section>

            <section class="anCard">
                <h3>10. Shorthand</h3>
                <div class="anTrack"><div class="anBox anShort">Combined</div></div>
            </section>

        </div>
    </main>


</body>
</html>
