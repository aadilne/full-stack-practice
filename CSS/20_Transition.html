<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <link rel="stylesheet" href="20_Transition.css">
</head>
<body>
    
<main class="trnPhaseWrap">
        <h1 class="trnPhaseTitle">CSS Transition</h1>
        <p class="trnPhaseInfo">Hover over each box to see the effect.</p>

        <div class="trnGrid">

            <section class="trnCard">
                <h3>1. Property</h3>
                <div class="trnBox trnProperty">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>2. Duration</h3>
                <div class="trnBox trnDuration">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>3. Timing Function</h3>
                <div class="trnBox trnTiming">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>4. Delay</h3>
                <div class="trnBox trnDelay">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>5. Shorthand</h3>
                <div class="trnBox trnShort">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>6. Ease-in</h3>
                <div class="trnBox trnEase">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>7. Hover Effect</h3>
                <div class="trnBox trnHoverBox">Hover me</div>
            </section>

            <section class="trnCard">
                <h3>8. Multiple Transitions</h3>
                <div class="trnBox trnMultiple">Hover me</div>
            </section>

        </div>
    </main>

</body>
</html>
