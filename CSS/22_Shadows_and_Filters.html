<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Filters</title>
    <link rel="stylesheet" href="22_Shadows_and_Filters.css">
</head>
<body>

    <main class="sfPhaseWrap">
        <h1 class="sfPhaseTitle">CSS Shadows & Filters</h1>
        <p class="sfPhaseInfo">Har card ka effect dekho.</p>

        <div class="sfGrid">

            <section class="sfCard">
                <h3>1. Box Shadow</h3>
                <div class="sfBox sfBoxShadow">Shadow</div>
            </section>

            <section class="sfCard">
                <h3>2. Text Shadow</h3>
                <p class="sfTextShadow">Shadow Text</p>
            </section>

            <section class="sfCard">
                <h3>3. Blur</h3>
                <div class="sfSample sfBlur">BLUR</div>
            </section>

            <section class="sfCard">
                <h3>4. Brightness</h3>
                <div class="sfSample sfBrightness">BRIGHT</div>
            </section>

            <section class="sfCard">
                <h3>5. Contrast</h3>
                <div class="sfSample sfContrast">CONTRAST</div>
            </section>

            <section class="sfCard">
                <h3>6. Grayscale</h3>
                <div class="sfSample sfGrayscale">GRAY</div>
            </section>

            <section class="sfCard">
                <h3>7. Sepia</h3>
                <div class="sfSample sfSepia">SEPIA</div>
            </section>

            <section class="sfCard">
                <h3>8. Saturate</h3>
                <div class="sfSample sfSaturate">COLOR</div>
            </section>

            <section class="sfCard">
                <h3>9. Opacity</h3>
                <div class="sfSample sfOpacity">FADED</div>
            </section>

            <section class="sfCard">
                <h3>10. Drop Shadow</h3>
                <div class="sfDropShape">DROP</div>
            </section>

        </div>
    </main>

    
</body>
</html>
